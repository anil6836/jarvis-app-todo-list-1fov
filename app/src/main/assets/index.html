<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fb">
  <title>ToDo List</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7fb;
      --surface: #ffffff;
      --ink: #202333;
      --muted: #85899a;
      --line: #ececf2;
      --accent: #6558d3;
      --accent-soft: #efedff;
      --green: #299c75;
      --danger: #dc5b67;
      --shadow: 0 8px 28px rgba(38, 37, 73, .07);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 680px;
      margin: 0 auto;
      background: var(--bg);
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
    }

    .topbar {
      height: 68px;
      min-height: 68px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--accent);
      box-shadow: 0 5px 12px rgba(101, 88, 211, .25);
    }

    .brand-mark svg { width: 21px; height: 21px; }
    .app-name { font-size: 19px; font-weight: 750; letter-spacing: -.4px; }
    .save-label {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .save-dot { width: 7px; height: 7px; border-radius: 50%; background: #48b58b; }

    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 8px 20px 0;
    }

    .welcome { padding: 10px 2px 19px; }
    .date-label {
      color: var(--accent);
      font-weight: 750;
      font-size: 12px;
      letter-spacing: 1.25px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 34px);
      line-height: 1.16;
      letter-spacing: -1.1px;
      font-weight: 780;
    }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 14px; }

    .progress-card {
      background: var(--surface);
      border: 1px solid rgba(236, 236, 242, .8);
      border-radius: 18px;
      padding: 16px 17px 15px;
      box-shadow: var(--shadow);
      margin-bottom: 21px;
    }
    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .progress-title { font-size: 13px; font-weight: 700; }
    .progress-count { color: var(--muted); font-size: 12px; font-weight: 650; }
    .progress-track { height: 7px; background: #efeff5; border-radius: 99px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #7b6feb, #a295f5);
      transition: width .35s ease;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 12px;
    }
    .section-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.3px; font-weight: 750; }
    .clear-button {
      border: 0;
      background: transparent;
      color: var(--danger);
      font-weight: 700;
      font-size: 12px;
      min-height: 36px;
      padding: 0 3px 0 10px;
      cursor: pointer;
    }

    .filters {
      display: flex;
      gap: 8px;
      padding: 0 0 14px;
    }
    .filter {
      min-height: 37px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: #74788a;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
    }
    .filter.active {
      color: white;
      background: var(--ink);
      border-color: var(--ink);
    }
    .filter-count {
      display: inline-grid;
      place-items: center;
      min-width: 19px;
      height: 19px;
      margin-left: 5px;
      padding: 0 5px;
      border-radius: 20px;
      background: rgba(126, 129, 145, .13);
      font-size: 10px;
    }
    .filter.active .filter-count { color: var(--ink); background: white; }

    .list-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 1px 10px;
      scrollbar-width: none;
    }
    .list-scroll::-webkit-scrollbar { display: none; }

    .task-list { display: flex; flex-direction: column; gap: 9px; }
    .task {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 12px 11px 14px;
      background: var(--surface);
      border: 1px solid #efeff4;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(38, 37, 73, .035);
      animation: appear .23s ease both;
      transition: opacity .2s ease, transform .2s ease, background .2s ease;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .check-button {
      flex: 0 0 27px;
      width: 27px;
      height: 27px;
      padding: 0;
      border: 2px solid #c9cad6;
      border-radius: 9px;
      background: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .18s ease;
    }
    .check-button:active { transform: scale(.9); }
    .check-button svg { width: 15px; height: 15px; opacity: 0; transform: scale(.7); transition: .18s ease; }
    .task.is-complete .check-button { border-color: var(--green); background: var(--green); }
    .task.is-complete .check-button svg { opacity: 1; transform: scale(1); }
    .task-text {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 560;
      overflow-wrap: anywhere;
      transition: color .2s ease;
    }
    .task.is-complete .task-text { color: #a0a2ae; text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .delete-button {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #a3a5b1;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }
    .delete-button:active { background: #fff0f1; color: var(--danger); }
    .delete-button svg { width: 19px; height: 19px; }

    .empty-state {
      min-height: 205px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 20px;
      color: var(--muted);
      animation: appear .25s ease both;
    }
    .empty-icon {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
      margin-bottom: 13px;
    }
    .empty-icon svg { width: 27px; height: 27px; }
    .empty-state strong { color: var(--ink); font-size: 15px; margin-bottom: 5px; }
    .empty-state span { font-size: 13px; line-height: 1.45; max-width: 240px; }

    .composer-wrap {
      flex-shrink: 0;
      padding: 10px 20px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgba(247,247,251,0), var(--bg) 17%);
    }
    .composer {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border: 1px solid #e9e8f1;
      border-radius: 17px;
      padding: 6px 7px 6px 17px;
      box-shadow: 0 7px 24px rgba(38, 37, 73, .09);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .composer:focus-within { border-color: #aaa1ef; box-shadow: 0 7px 24px rgba(101, 88, 211, .13); }
    .composer input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      padding: 10px 0;
    }
    .composer input::placeholder { color: #a3a5b1; }
    .add-button {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 0;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(101, 88, 211, .22);
      transition: transform .15s ease, background .15s ease;
    }
    .add-button:active { transform: scale(.93); background: #5145bd; }
    .add-button svg { width: 22px; height: 22px; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    @media (min-width: 600px) {
      .app { border-left: 1px solid #efeff4; border-right: 1px solid #efeff4; }
      .main { padding-left: 28px; padding-right: 28px; }
      .topbar { padding-left: 30px; padding-right: 30px; }
      .composer-wrap { padding-left: 28px; padding-right: 28px; }
    }
    @media (max-height: 650px) {
      .welcome { padding-top: 3px; padding-bottom: 12px; }
      .progress-card { padding: 12px 15px; margin-bottom: 13px; }
      .progress-top { margin-bottom: 8px; }
      .section-heading { margin-bottom: 7px; }
      .filters { padding-bottom: 9px; }
      .composer-wrap { padding-top: 5px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="m5 12.5 4.2 4L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 3.5h6.5A2.5 2.5 0 0 1 21 6v12a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18V6a2.5 2.5 0 0 1 2.5-2.5H8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="app-name">ToDo List</div>
      <div class="save-label"><span class="save-dot"></span>Saved on this device</div>
    </header>

    <main class="main">
      <section class="welcome" aria-label="Today's overview">
        <div class="date-label" id="dateLabel"></div>
        <h1 id="greeting">Make today count.</h1>
        <p class="subtitle" id="subtitle">A little progress goes a long way.</p>
      </section>

      <section class="progress-card" aria-label="Task progress">
        <div class="progress-top">
          <span class="progress-title">Your progress</span>
          <span class="progress-count" id="progressCount">0 of 0 done</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </section>

      <div class="section-heading">
        <h2 id="listHeading">Your tasks</h2>
        <button class="clear-button" id="clearCompleted" type="button" hidden>Clear completed</button>
      </div>

      <nav class="filters" aria-label="Filter tasks">
        <button class="filter active" type="button" data-filter="all" aria-pressed="true">All <span class="filter-count" id="allCount">0</span></button>
        <button class="filter" type="button" data-filter="pending" aria-pressed="false">Pending <span class="filter-count" id="pendingCount">0</span></button>
        <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed <span class="filter-count" id="completedCount">0</span></button>
      </nav>

      <section class="list-scroll" id="listScroll" aria-label="Tasks">
        <div class="task-list" id="taskList"></div>
      </section>
    </main>

    <footer class="composer-wrap">
      <form class="composer" id="taskForm" autocomplete="off">
        <label class="visually-hidden" for="taskInput">Add a task</label>
        <input id="taskInput" type="text" maxlength="180" placeholder="Add a task..." enterkeyhint="done">
        <button class="add-button" type="submit" aria-label="Add task">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "todo-list-tasks-v1";
      var tasks = loadTasks();
      var activeFilter = "all";

      var taskList = document.getElementById("taskList");
      var taskForm = document.getElementById("taskForm");
      var taskInput = document.getElementById("taskInput");
      var clearCompletedButton = document.getElementById("clearCompleted");
      var filters = Array.prototype.slice.call(document.querySelectorAll(".filter"));

      function loadTasks() {
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          var parsed = stored ? JSON.parse(stored) : [];
          if (!Array.isArray(parsed)) return [];
          return parsed.filter(function (task) {
            return task && typeof task.text === "string" && typeof task.completed === "boolean";
          }).map(function (task) {
            return {
              id: String(task.id || makeId()),
              text: task.text.slice(0, 180),
              completed: task.completed,
              createdAt: Number(task.createdAt) || Date.now()
            };
          });
        } catch (e) {
          return [];
        }
      }

      function makeId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {
          // Keep the app usable even if device storage is unavailable.
        }
      }

      function updateDateAndGreeting() {
        var now = new Date();
        document.getElementById("dateLabel").textContent = new Intl.DateTimeFormat(undefined, {
          weekday: "long", month: "long", day: "numeric"
        }).format(now);
        var hour = now.getHours();
        var greeting = hour < 12 ? "Good morning." : (hour < 17 ? "Good afternoon." : "Good evening.");
        document.getElementById("greeting").textContent = greeting;
      }

      function makeEmptyState(title, message) {
        var empty = document.createElement("div");
        empty.className = "empty-state";

        var icon = document.createElement("div");
        icon.className = "empty-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5h8M8 9.5h8M8 13.5h5M5.5 3.5h13A1.5 1.5 0 0 1 20 5v14a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V5a1.5 1.5 0 0 1 1.5-1.5Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="m15.5 16 1.5 1.5 3-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        var strong = document.createElement("strong");
        strong.textContent = title;
        var span = document.createElement("span");
        span.textContent = message;

        empty.appendChild(icon);
        empty.appendChild(strong);
        empty.appendChild(span);
        return empty;
      }

      function render() {
        var pending = tasks.filter(function (task) { return !task.completed; }).length;
        var completed = tasks.length - pending;
        var percent = tasks.length ? Math.round((completed / tasks.length) * 100) : 0;

        document.getElementById("allCount").textContent = tasks.length;
        document.getElementById("pendingCount").textContent = pending;
        document.getElementById("completedCount").textContent = completed;
        document.getElementById("progressCount").textContent = completed + " of " + tasks.length + " done";
        document.getElementById("progressFill").style.width = percent + "%";
        document.querySelector(".progress-track").setAttribute("aria-valuenow", percent);
        clearCompletedButton.hidden = completed === 0;

        var subtitle = document.getElementById("subtitle");
        if (tasks.length === 0) {
          subtitle.textContent = "A little progress goes a long way.";
        } else if (pending === 0) {
          subtitle.textContent = "Everything is done. Nice work!";
        } else {
          subtitle.textContent = pending === 1 ? "You have 1 task left to do." : "You have " + pending + " tasks left to do.";
        }

        filters.forEach(function (button) {
          var selected = button.getAttribute("data-filter") === activeFilter;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-pressed", selected ? "true" : "false");
        });

        var visibleTasks = tasks.filter(function (task) {
          if (activeFilter === "pending") return !task.completed;
          if (activeFilter === "completed") return task.completed;
          return true;
        });

        taskList.replaceChildren();

        if (visibleTasks.length === 0) {
          var title, message;
          if (activeFilter === "pending") {
            title = "All caught up!";
            message = "You don't have any pending tasks.";
          } else if (activeFilter === "completed") {
            title = "Nothing completed yet";
            message = "Finished tasks will show up here.";
          } else {
            title = "Your list is clear";
            message = "Add a task below and get started.";
          }
          taskList.appendChild(makeEmptyState(title, message));
          return;
        }

        visibleTasks.forEach(function (task) {
          var row = document.createElement("article");
          row.className = "task" + (task.completed ? " is-complete" : "");

          var toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "check-button";
          toggle.setAttribute("aria-label", task.completed ? "Mark task incomplete" : "Mark task complete");
          toggle.setAttribute("aria-pressed", task.completed ? "true" : "false");
          toggle.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m4.5 10.2 3.5 3.4 7.5-7.3" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          toggle.addEventListener("click", function () {
            task.completed = !task.completed;
            saveTasks();
            render();
          });

          var text = document.createElement("div");
          text.className = "task-text";
          text.textContent = task.text;

          var remove = document.createElement("button");
          remove.type = "button";
          remove.className = "delete-button";
          remove.setAttribute("aria-label", "Delete task");
          remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.8h5V7m3.5 0-.8 12.2H6.8L6 7m4 3.2v5.5m4-5.5v5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          remove.addEventListener("click", function () {
            tasks = tasks.filter(function (item) { return item.id !== task.id; });
            saveTasks();
            render();
          });

          row.appendChild(toggle);
          row.appendChild(text);
          row.appendChild(remove);
          taskList.appendChild(row);
        });
      }

      taskForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var text = taskInput.value.trim();
        if (!text) {
          taskInput.focus();
          return;
        }
        tasks.unshift({
          id: makeId(),
          text: text,
          completed: false,
          createdAt: Date.now()
        });
        saveTasks();
        activeFilter = "all";
        taskInput.value = "";
        render();
        document.getElementById("listScroll").scrollTop = 0;
        taskInput.focus();
      });

      filters.forEach(function (button) {
        button.addEventListener("click", function () {
          activeFilter = button.getAttribute("data-filter");
          render();
        });
      });

      clearCompletedButton.addEventListener("click", function () {
        tasks = tasks.filter(function (task) { return !task.completed; });
        saveTasks();
        render();
      });

      updateDateAndGreeting();
      render();
    })();
  </script>
</body>
</html>
